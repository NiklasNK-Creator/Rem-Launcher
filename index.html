<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rem Launcher</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #7dd3fc; color: #0c4a6e; margin: 2rem; }
      #results, #accounts, #instances { display: grid; gap: 0.75rem; margin-top: 1rem; }
      .card { background: #fff; border-radius: 0.5rem; padding: 0.75rem 1rem; display: flex; gap: 0.5rem; align-items: center; }
      .card button { margin-left: auto; }
      section { margin-top: 2rem; }
      #code { font-size: 1.5rem; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>💙 Rem Launcher</h1>
    <section>
      <h2>Play</h2>
      <select id="play-account"></select>
      <select id="play-instance"></select>
      <button id="play-btn">Play</button>
      <button id="log-btn">Show log</button>
      <div id="play-status"></div>
      <pre id="game-log"></pre>
    </section>
    <section>
      <h2>Accounts</h2>
      <input id="offline-name" placeholder="Offline username" maxlength="16" />
      <button id="add-offline">Add offline account</button>
      <button id="add-ms">Add Microsoft account</button>
      <div id="code"></div>
      <div id="accounts"></div>
    </section>
    <section>
      <h2>Instances</h2>
      <input id="inst-name" placeholder="Instance name" maxlength="64" />
      <select id="inst-version"></select>
      <input id="inst-loader" placeholder="Loader (vanilla/fabric/forge)" value="fabric" />
      <button id="create-inst">Create instance</button>
      <input id="mrpack-path" placeholder="Path to .mrpack file" size="40" />
      <button id="import-mrpack">Import .mrpack</button>
      <div id="instances"></div>
    </section>
    <section>
      <h2>Mods</h2>
      <select id="content-type">
        <option value="mod">Mods</option>
        <option value="resourcepack">Resource packs</option>
        <option value="shader">Shaders</option>
        <option value="datapack">Datapacks</option>
        <option value="modpack">Modpacks</option>
      </select>
      <input id="q" placeholder="Search Modrinth…" value="sodium" />
      <button id="go">Search</button>
      <div id="results"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
