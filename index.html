<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rem Launcher</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #7dd3fc; color: #0c4a6e; margin: 2rem; }
      #results, #accounts { display: grid; gap: 0.75rem; margin-top: 1rem; }
      .card { background: #fff; border-radius: 0.5rem; padding: 0.75rem 1rem; display: flex; gap: 0.5rem; align-items: center; }
      .card button { margin-left: auto; }
      section { margin-top: 2rem; }
      #code { font-size: 1.5rem; font-weight: bold; }
    </style>
  </head>
  <body>
    <h1>💙 Rem Launcher</h1>
    <section>
      <h2>Accounts</h2>
      <input id="offline-name" placeholder="Offline username" maxlength="16" />
      <button id="add-offline">Add offline account</button>
      <button id="add-ms">Add Microsoft account</button>
      <div id="code"></div>
      <div id="accounts"></div>
    </section>
    <section>
      <h2>Mods</h2>
      <input id="q" placeholder="Search Modrinth mods…" value="sodium" />
      <button id="go">Search</button>
      <div id="results"></div>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
